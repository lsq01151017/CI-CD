name: Build Docker Image
on:
  push:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录Github容器仓库ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Python‑web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.python
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/python-web:latest

      - name: Build & Push Golang‑web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.golang
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/go-web:latest
